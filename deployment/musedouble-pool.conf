; Install as /etc/php/8.3/fpm/pool.d/musedouble.conf after enabling pdo_sqlite.
[musedouble]
user = musedouble
group = musedouble
listen = /run/php/php-musedouble.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 4
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 300
clear_env = yes
env[MUSEDOUBLE_DATA_DIR] = /home/musedouble/private-backend
php_admin_value[upload_max_filesize] = 22M
php_admin_value[post_max_size] = 25M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 120
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /home/musedouble/private-backend/php-error.log
security.limit_extensions = .php
