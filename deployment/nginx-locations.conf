# Integrate into musedouble.com's HTTPS server block; this is not a full vhost.
# Use the PHP-FPM socket/pool configured by the provider for user musedouble.
# Back up the original vhost privately, validate nginx -t, then reload.
root /home/musedouble/public_html/musedouble.com;
index index.php index.html;
client_max_body_size 25m;

location = / { try_files /index.html =404; }
location = /index.php {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_pass unix:/run/php/php-musedouble.sock;
}
location = /api.php {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/api.php;
    fastcgi_read_timeout 120s;
    fastcgi_pass unix:/run/php/php-musedouble.sock;
}
location = /control-musedouble { return 302 /control-musedouble/; }
location = /control-musedouble/ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/control-musedouble/index.php;
    fastcgi_pass unix:/run/php/php-musedouble.sock;
}
location = /index.html { try_files $uri =404; }
location ~ ^/[a-z0-9_-]+\.(css|js)$ { try_files $uri =404; }
location ~ ^/assets/[a-zA-Z0-9_/-]+\.(png|jpg|jpeg|webp|svg)$ { try_files $uri =404; }
# Everything else is private, including source modules, backups and uploads.
location / { return 404; }
