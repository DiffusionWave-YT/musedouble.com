# Replace only /etc/nginx/sites-available/musedouble.conf after a private backup.
server {
    listen 208.122.213.205:80;
    server_name musedouble.com www.musedouble.com;
    return 301 https://$host$request_uri;
}

server {
    listen 208.122.213.205:443 ssl;
    server_name musedouble.com www.musedouble.com;
    ssl_certificate /etc/letsencrypt/live/musedouble.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/musedouble.com/privkey.pem;
    root /home/musedouble/public_html/musedouble.com;
    index index.php index.html;
    client_max_body_size 25m;

    # The public shell is static; authentication and generation run in api.php.
    location = / { try_files /index.html =404; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php-musedouble.sock;
    }
    location = /api.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api.php;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 120s;
        fastcgi_pass unix:/run/php/php-musedouble.sock;
    }
    location = /control-musedouble { return 302 /control-musedouble/; }
    location = /control-musedouble/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/control-musedouble/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php-musedouble.sock;
    }
    location = /index.html { try_files $uri =404; }
    location ~ ^/[a-z0-9_-]+\.(css|js)$ { try_files $uri =404; }
    location ~ ^/assets/[a-zA-Z0-9_/-]+\.(png|jpg|jpeg|webp|svg)$ { try_files $uri =404; }
    location / { return 404; }
}
